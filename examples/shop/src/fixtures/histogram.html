<!doctype html>
<meta charset="utf-8" />
<style>
  body { font: 13px system-ui, sans-serif; color: var(--vscode-foreground, #ccc); background: var(--vscode-editor-background, #1e1e1e); margin: 0; padding: 12px; }
  .chart { display: flex; gap: 10px; height: 160px; }
  .bucket { display: flex; gap: 2px; flex: 1; }
  .bar { flex: 1; min-width: 12px; align-self: flex-end; }
  .actual { background: #4e9af1; }
  .expected { background: #f1a54e; opacity: 0.7; }
  .legend span { display: inline-block; width: 10px; height: 10px; margin-right: 4px; }
</style>
<div class="legend"><span class="actual"></span>actual &nbsp; <span class="expected"></span>expected</div>
<div class="chart" id="chart"></div>
<p id="status"></p>
<script>
  window.addEventListener("message", ({ data }) => {
    if (data?.type !== "in-source-companion:result") return;
    const actual = Array.from(data.actual);
    const expected = Array.from(data.expected ?? []);
    const max = Math.max(...actual, ...expected, 1);
    const chart = document.getElementById("chart");
    chart.replaceChildren();
    for (let i = 0; i < Math.max(actual.length, expected.length); i++) {
      const bucket = document.createElement("div");
      bucket.className = "bucket";
      bucket.title = `bucket ${i}: actual ${actual[i] ?? "–"}, expected ${expected[i] ?? "–"}`;
      for (const [kind, value] of [["actual", actual[i] ?? 0], ["expected", expected[i] ?? 0]]) {
        const bar = document.createElement("div");
        bar.className = `bar ${kind}`;
        bar.style.height = `${(value / max) * 100}%`;
        bucket.append(bar);
      }
      chart.append(bucket);
    }
    document.getElementById("status").textContent = data.passed ? "✓ distributions match" : `✗ ${data.message ?? "distributions differ"}`;
  });
</script>
